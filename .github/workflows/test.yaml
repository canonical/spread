name: Test spread

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master


jobs:
  run-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          sudo snap install go --classic
          go test -v ./...

      - name: Build local spread
        run: |
          mkdir spread-testing
          cd spread-testing
          git init
          git remote add origin https://github.com/canonical/spread.git
          # Pin spread to a known stable commit; update only after verification.
          git fetch --depth=1 origin 9fdce848027b944a50d25ed2271f17c213b44bd5
          git checkout FETCH_HEAD
          go build -o spread-testing ./cmd/spread
          sudo install -m755 spread-testing /usr/bin/spread
          cd ..
          rm -Rf spread-testing

      - name: Run spread tests
        run: |
          uname -a
          SPREAD_GOOGLE_KEY=$(echo "${{ secrets.SPREAD_GOOGLE_KEY }}" | base64 -d) /usr/bin/spread google:

      - name: Discard spread workers
        if: always()
        run: |
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            spread -discard -reuse-pid="$(echo "$r" | grep -o -E '[0-9]+')"
          done

  snap-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build snap
        id: snap
        uses: canonical/action-build@v1
      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.snap.outputs.snap }}

  snap-test:
    needs:
      - snap-build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download snap artifact
        uses: actions/download-artifact@v4
        with:
          name: snap

      - name: Install LXD
        run: |
          sudo snap install lxd
          sudo lxd init --auto
          sudo lxd waitready --timeout 60

      - name: Install spread snap
        run: |
          sudo snap install --dangerous ./*.snap
          sudo snap connect spread:lxd lxd:lxd

      - name: Verify bundled lxc client is executable
        run: |
          snap run --shell spread -c 'lxc --version'

      - name: Run LXD backend smoke test
        run: |
          cd tests/lxd
          /snap/bin/spread -v lxd:ubuntu-24.04:checks/main

      - name: Remove spread snap
        if: always()
        run: |
          sudo snap remove --purge spread || true
